<style id="skin-css-latex" data-from="skins/latex/style.css">
:root {
    /* 参考图：底色是一张略暗的乳胶膜，鼓包是近白的 */

    /* 台面（膜面）三段：左上近白 → 右下渐暗 */
    /* 纸面：比气泡略暗一点、同色温 —— 泡才会读成从这张膜上鼓起来的 */
    --sheet-1: #f1ebe6;
    --sheet-2: #e9e1da;
    --sheet-3: #dbd2cb;

    /* 鼓包体色三段 + 边缘高光强度（深色主题要压一点，否则边缘过曝） */
    --face-1: #fffefe;
    --face-2: #fdf8f6;
    --face-3: #efe5e3;
    --rim-a: 1;
    --rim-soft: 0.95;
    --sheen-a: 1;
    --spec-a: 1;

    /* SVG 光照滤镜的底色（滤镜负责明暗，这里只给乳胶的本色） */
    --blob-tint: #fbf7f4;
    --blob-tint-hover: #fffdfb;
    --blob-tint-press: #ece4e0;
    --lip-a: 0.5;
    --ink: #17161a;
    --ink-soft: #45434a;
    --ink-mute: #7c7a82;
    --accent: #2a282e;
    --accent-soft: #57545c;
    --font-display: "Outfit", "Nunito", sans-serif;
    --font-body: "Nunito", "Outfit", sans-serif;

    /* 固定左上主光，不跟鼠标跑 */
    --shine-x: 26%;
    --shine-y: 14%;

    /* 乳胶会把环境色吸进暗部 —— 参考图里暗部是偏紫灰，不是中性灰 */
    --shadow: 168, 149, 156;
    --ao: 152, 132, 141;
    --rim: 255, 255, 255;

    /*
     * 乳胶面：关键是被拉长的「条状反光」—— 光在光滑曲面上会被拉成一条光带，
     * 这是乳胶衣最明显的特征（参考图里手臂和腿上的亮线就是这个）。
     */
    --gloss-face:
        linear-gradient(
            124deg,
            rgba(255, 255, 255, 0) 30%,
            rgba(255, 255, 255, calc(var(--sheen-a) * 0.4)) 34%,
            rgba(255, 255, 255, var(--sheen-a)) 37.5%,
            rgba(255, 255, 255, calc(var(--sheen-a) * 0.55)) 41%,
            rgba(255, 255, 255, calc(var(--sheen-a) * 0.12)) 45%,
            rgba(255, 255, 255, 0) 52%
        ),
        linear-gradient(
            124deg,
            rgba(255, 255, 255, 0) 47%,
            rgba(255, 255, 255, calc(var(--sheen-a) * 0.85)) 50%,
            rgba(255, 255, 255, 0) 53.5%
        ),
        linear-gradient(
            124deg,
            rgba(255, 255, 255, 0) 16%,
            rgba(255, 255, 255, calc(var(--sheen-a) * 0.7)) 19%,
            rgba(255, 255, 255, 0) 23%
        ),
        radial-gradient(
            ellipse 80% 66% at var(--shine-x) var(--shine-y),
            rgba(255, 255, 255, var(--sheen-a)) 0%,
            rgba(255, 255, 255, calc(var(--sheen-a) * 0.45)) 46%,
            rgba(255, 255, 255, 0) 80%
        ),
        linear-gradient(
            178deg,
            var(--face-1) 0%,
            var(--face-2) 50%,
            var(--face-3) 100%
        );

    /* 整圈压边（乳胶压在台面上的环境遮蔽）+ 下方方向阴影 + 内部卷边 */
    --gloss-raise:
        0 0 0 1px rgba(var(--ao), 0.05),
        0 2px 7px rgba(var(--ao), 0.1),
        0 18px 28px -12px rgba(var(--ao), 0.38),
        0 7px 14px -9px rgba(var(--shadow), 0.22),
        inset 0 2px 1px rgba(var(--rim), var(--rim-a)),
        inset 3px 2px 6px -3px rgba(var(--rim), var(--rim-soft)),
        inset 0 -22px 18px -16px rgba(var(--rim), 0.5),
        inset 0 -6px 6px -3px rgba(var(--ao), 0.34),
        inset -5px -3px 8px -6px rgba(var(--ao), 0.26);

    --gloss-hover:
        0 0 0 1px rgba(var(--ao), 0.04),
        0 3px 9px rgba(var(--ao), 0.12),
        0 22px 32px -12px rgba(var(--ao), 0.42),
        0 9px 16px -9px rgba(var(--shadow), 0.24),
        inset 0 2px 1px rgba(var(--rim), var(--rim-a)),
        inset 3px 2px 6px -3px rgba(var(--rim), var(--rim-soft)),
        inset 0 -22px 18px -16px rgba(var(--rim), 0.58),
        inset 0 -6px 6px -3px rgba(var(--ao), 0.3),
        inset -5px -3px 8px -6px rgba(var(--ao), 0.22);

    /* 按下：整块压进膜里 —— 顶部暗、底/右返光 */
    --gloss-press:
        inset 0 16px 22px rgba(var(--ao), 0.42),
        inset 0 -12px 20px rgba(var(--rim), 0.9),
        inset 0 -2px 0 rgba(var(--rim), 0.6),
        inset 5px 0 12px rgba(var(--ao), 0.14),
        0 3px 8px -4px rgba(var(--shadow), 0.3);

    --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    min-height: 100%;
}

body {

        radial-gradient(ellipse 66% 66% at 97% 101%, rgba(var(--ao), 0.22) 0%, transparent 66%),
        radial-gradient(ellipse 80% 55% at 18% -4%, rgba(255, 255, 255, 0.9) 0%, transparent 62%),
        linear-gradient(
            148deg,
            var(--sheet-1) 0%,
            var(--sheet-2) 30%,
            var(--sheet-2) 58%,
            var(--sheet-3) 100%
        );
    color: var(--ink);

    font-family: var(--font-body);

/* 不再用全屏 WebGL 画鼓包 */
#latex-light,
#latex-displace,
#latex-svg-defs {
    display: none !important;
}

#latex-noise {
    position: fixed;
    inset: 0;
    /* 盖在内容之上：纸面和气泡共用同一层颗粒，才像同一种材料 */
    z-index: 30;
    pointer-events: none;
    background: var(--noise);
    background-size: 220px 220px;
    opacity: 0.045;
    mix-blend-mode: soft-light;
}

#latex-ball {
    position: fixed;
    left: 0;
    top: 0;
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    z-index: 100;
    pointer-events: none;
    border-radius: 50%;
    opacity: 0;
    transform: translate3d(-9999px, -9999px, 0);
    will-change: transform, opacity;
    background:
        radial-gradient(circle at 32% 28%, #5a5a5a 0%, #1a1a1a 42%, #050505 78%, #000 100%);
    box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.28),
        0 3px 8px rgba(0, 0, 0, 0.2),
        inset 0 1px 2px rgba(255, 255, 255, 0.28),
        inset 0 -3px 6px rgba(0, 0, 0, 0.55);
}

html.has-pointer #latex-ball {
    opacity: 1;
}

html.has-pointer,
html.has-pointer * {
    cursor: none !important;
}

html.has-pointer #color-palette,
html.has-pointer #color-palette * {
    cursor: pointer !important;
}

#color-palette {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 120;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    pointer-events: auto;
}

.color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.55);
    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.18),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.color-swatch:hover {
    transform: scale(1.08);
}

.color-swatch.is-active {
    box-shadow:
        0 0 0 2px rgba(40, 40, 40, 0.55),
        0 2px 10px rgba(0, 0, 0, 0.22),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
}

html.theme-black .color-swatch.is-active {
    box-shadow:
        0 0 0 2px rgba(240, 240, 240, 0.75),
        0 2px 10px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

html.theme-black {
    --sheet-1: #2c2c31;
    --sheet-2: #202024;
    --sheet-3: #141416;
    --face-1: #3b3b42;
    --face-2: #26262c;
    --face-3: #171719;
    --rim-a: 0.5;
    --rim-soft: 0.4;
    --sheen-a: 0.26;
    --spec-a: 0.8;
    --blob-tint: #2b2b30;

    --blob-tint-press: #1d1d21;
    --lip-a: 0.22;
    --ink: #eceae6;
    --ink-soft: #b8b4ae;
    --ink-mute: #8a8680;
    --accent: #c4b8a8;
    --accent-soft: #d4c8b8;

}

html.theme-black #latex-noise {

html.theme-blue {

    --accent: #2a4a6a;

html.theme-orange {

    --blob-tint: #fbe7d6;
    --blob-tint-hover: #fff4ea;

#navbar,
#content {
    position: relative;
    z-index: 10;
    filter: none;
}

#navbar {

    border: none;
}

#navbar ul {

.nav-btn,
.card,
.btn,
.btn-back,
.btn-visit,
.blog-tab-btn,
.portfolio-item {
    position: relative;
    background: none;
    border: none;
    transition:
        transform 0.22s ease,
        filter 0.25s ease;
}

/*
 * 曲面由 SVG 光照滤镜生成（见 index.html 的 #latex-lit-*），
 * ::before 只负责形状和底色，文字/图片在它上面保持清晰。
 */
.nav-btn::before,
.card::before,
.btn::before,
.btn-back::before,
.btn-visit::before,
.blog-tab-btn::before,
.portfolio-item::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: var(--blob-tint, #f8f5f3);
    filter: url(#latex-lit-sm);
    /*
     * 膜被顶起来的地方会在气泡周围形成一圈「水meniscus」：左上被光打亮，
     * 下方是一圈贴地的接触阴影。这一亮一暗，气泡才和纸面连成同一张膜。
     */
    box-shadow:
        -8px -10px 22px -6px rgba(255, 255, 255, 0.8),
        0 16px 26px -12px rgba(var(--ao), 0.4),
        0 6px 12px -8px rgba(var(--shadow), 0.24);
    transition: background 0.25s ease;
}

.card::before,
.portfolio-item::before {
    filter: url(#latex-lit-lg);
}


.nav-btn:hover::before,
.btn:hover::before,
.blog-tab-btn:hover::before,
.portfolio-item:hover::before {
    background: var(--blob-tint-hover, #fdfbfa);
}

.nav-btn:hover,
.btn:hover,
.blog-tab-btn:hover,
.portfolio-item:hover {
    transform: translateY(-1px);
}

.nav-btn:active,
.card:active,
.btn:active,
.blog-tab-btn:active,
.blog-tab-btn.active,
.portfolio-item:active {
    transform: translateY(1px);
}

.nav-btn:active::before,
.btn:active::before,
.blog-tab-btn:active::before,
.blog-tab-btn.active::before,
.portfolio-item:active::before {
    background: var(--blob-tint-press, #e6dedb);
    filter: url(#latex-lit-sm-in);
}

.card:active::before,
.portfolio-item:active::before {
    filter: url(#latex-lit-lg-in);
}

.nav-btn {
    display: flex;
    padding: 0;
    /* 有机圆角（轻微不对称 = 充气乳胶的边缘） */
    border-radius: 34px 30px 33px 31px / 31px 34px 30px 34px;
    min-height: 3.4rem;
    /* 统一长度：四个导航按钮等宽 */
    min-width: 11.6rem;

    user-select: none;

/* 整块按钮都是点击区：内边距放在 <a> 上，并让 <a> 撑满按钮 */
.nav-btn a {

/* 逐个出现：顺序由 JS 按「从上到下、从左到右」写入 animation-delay */
.nav-btn,
.card,
.portfolio-item,
.blog-tab-btn {
    animation: panel-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards;
}

@keyframes panel-rise {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/*
 * ══ 交还系统光标（脚本出错时的保险，也是这条链子的最后一环）══
 *
 * 上面 `html.has-pointer *` 把系统光标整片压成了 none —— 位置全指望那颗球。
 * 所以这套主题一旦自己坏掉，用户失去的不是「一个好看的样式」，是**指针本身**。
 * ball.js 里那段 handBack 就是为此写的：脚本抛错就整台退场。
 *
 * 这一条是**CSS 那一半**，管的是「JS 那一半没跑成」的情况：
 *
 *   - ball.js 还没来得及跑就出错了：它的 error 监听要等 initBallCursor() 被叫到
 *     才装上，这中间任何一步抛错，装监听这件事自己就轮不到了；
 *   - handBack() 跑了一半被打断（它要摘的类是五个，摘到第三个的时候出错）；
 *   - 宿主决定关掉这套主题：直接往根上加 cursor-off 就行，不必先叫上 handBack()。
 *
 * 它唯一的依赖是「根上有没有这个类」，不依赖任何一段 JS 跑对 —— 这正是它存在的
 * 理由。全站只有 ball.js 会往根上加 has-pointer（三个外观的 style.css 里那条
 * 藏光标的规则也只听这个类），所以正常路径下管住这一个类就够了。
 *
 * 只要根上有 cursor-off，藏光标那几条规则就整片失效 —— 每个元素退回它**自己**
 * 该有的光标（正文是 I 形、按钮和链接是手型、别处是箭头），也就是「这套主题
 * 从没来过」的样子。不是一律 auto：那会把「这里能点」这个信息也一起抹掉。
 *
 * ── 为什么必须放在这个文件的最后 ──
 *
 * 它和上面那条 `html.has-pointer, html.has-pointer *` **特异性完全相同**，靠的就是
 * 书写顺序赢。三个外观的 style.css 里也各有一份一模一样的藏光标规则，但它们都在
 * skin-ui.css **之前**加载（见 index.html 的 link 顺序），所以真正的对手只有同文件里
 * 那一份 —— 排在它后面就够了。这一条挪到前面去，保险立刻失效，而且不报错。
 * tools/cursor-fx/test_safety.js 第 3 节盯着这个顺序。
 *
 * `#color-palette` / `#skin-switcher` 那几条带 id 的规则（让色板和切换器保持手型）
 * 特异性更高，这里**故意不压**：交还之后它们给的是原版手型，正是想要的。
 */
html.cursor-off,
html.cursor-off * {
    cursor: auto !important;
}

/*

/* ===== 光标本体 ===== */

.cfx {

    left: 0;
    top: 0;
    width: 0;
    height: 0;
    pointer-events: none;

 * 和展示页里「格子正中为原点」是同一个约定。

 * 谁在上面都一样，但收尾时液体得压得住正在淡回来的球。
 */
.cfx-fixed {
    position: fixed;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    z-index: 201;
    pointer-events: none;

    opacity: 0;
    transition: none;

 *                  而投影的 alpha 远低于阈值,留在里面会被整个吃掉。
 *   .cfx-goo    —— 液体本体,被 goo 滤镜塑形,球与球之间才会长出颈。
 */
.cfx-shadow,
.cfx-goo {
    position: absolute;
    left: -55px;
    top: -55px;
    width: 110px;
    height: 110px;
    pointer-events: none;

    filter: blur(7px);
    opacity: 0.28;
    transform: translateY(8px);

    top: 50%;
    width: 26px;
    height: 26px;

        #050505 78%,

 * 为什么按住」是自明的;形状对不对,指针放上去就知道。

 * 「缩放边上的元素里的段落」不能变回 I 形,和「链接里的段落」是同一个坑,靠的是
 * skin-ui.css 那条 :not() 排除链里也排掉了这四个 data-resize 的值。

.cx-win {
    position: relative;
    width: min(100%, 30rem);
    border-radius: 16px;
    overflow: hidden;
    background: rgba(127, 127, 127, 0.1);
    border: 1px solid rgba(127, 127, 127, 0.35);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
    font-size: 0.86rem;
    line-height: 1.5;
    color: var(--ink-mute, #7c7a82);
    /* 缩放时每帧都在改 width/height/transform,别让浏览器给它们加过渡 */

    transition: box-shadow 160ms ease;
    /* 拖的时候别把里面的字选中 */
    user-select: none;

.cx-zoom-label {
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--ink-mute, #7c7a82);
}

.cx-win-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    background: rgba(127, 127, 127, 0.14);
    border-bottom: 1px solid rgba(127, 127, 127, 0.25);
}

/*
 * 标题栏同时是窗口的**移动把手**,所以它标的是 data-drag="move"(抓起来的形态
 * 就是「点下去那一摊」)。这一条只管视觉:把手要看着像一条能抓的带子,
 * 所以底色比标题栏默认再重一点,并且里面那几个装饰性元素不吃命中 ——
 * 圆点和标题都只是画在上面的东西,指针落在哪一颗上都该是「这条带子」。
 *
 * 角上的 data-resize="nw" 那个把手压在它左上角,那是另一个宿主:
 * 同一根元素上两个值,`!important` 那条(缩放)按设计赢 —— 这是故意的,
 * 真窗口的左上角也是「先缩放、再移动」。
 */
.cx-win-bar[data-drag="move"] {
    background: rgba(127, 127, 127, 0.22);
    border-radius: 10px 10px 0 0;
}

.cx-win-bar[data-drag="move"] .cx-win-dots,
.cx-win-bar[data-drag="move"] .cx-win-title {
    pointer-events: none;
}

.cx-win-dots {
    display: inline-flex;
    gap: 0.3rem;
}

.cx-win-dots i {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: rgba(127, 127, 127, 0.45);
}

.cx-win-title {
    font-weight: 700;
    font-size: 0.8rem;
}

.cx-win-body {
    padding: 0.75rem 1rem;
}

.cx-win-body .cx-play-text {
    margin: 0;
    padding: 0;
    background: none;
    border: 0;
    border-radius: 0;
}

/*
 * 文本那两个宿主。和上面那块标了 .cursor-not-allowed 的虚线框是同一族的视觉,
 * 免得读者以为是漏了样式 —— 它们同样只是「一块声明了 --cursor 的地方」。
 * 刻意不写成 .btn 那种样子:文本状态要的是一块能读/能打字的区域。
 */
.cx-play-text,
.cx-play-input {
    display: block;
    margin: 0;
    padding: 0.75rem 1rem;
    border-radius: 14px;
    font-size: 0.86rem;
    line-height: 1.5;
    font-family: inherit;
    color: var(--ink-mute, #7c7a82);
    background: rgba(127, 127, 127, 0.1);
    border: 1px dashed rgba(127, 127, 127, 0.5);
}

.cx-play-text { max-width: 44ch; }
.cx-play-input { width: 22ch; }
.cx-play-input::placeholder { color: rgba(127, 127, 127, 0.75); }

/* 包在链接里的那个段落:让整块都可点,但看起来仍然是一段正文 */
.cx-play-linkcard {
    display: block;
    max-width: 44ch;
    text-decoration: none;
}

.cx-play h2 {
    font-size: 0.95rem;
    margin: 0 0 0.5rem;
}

.cx-play .cx-note {
    max-width: 72ch;
}

.cx-pending {
    margin-top: 1.6rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(127, 127, 127, 0.22);
}

.cx-pending h2 {
    font-size: 0.95rem;
    margin: 0 0 0.5rem;
}

.cx-pending h3 {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 1rem 0 0.3rem;
    color: var(--ink-soft, #4a484f);
}

.cx-pending h3:first-of-type {
    margin-top: 0;
}

.cx-pending ul {
    margin: 0;
    padding-left: 1.1rem;
    font-size: 0.82rem;
    line-height: 1.7;
    color: var(--ink-mute, #7c7a82);
}

/*
 * 减弱动效:液体这套东西自己带的两处过渡收掉。
 *
 *   .cfx            淡入淡出(.cfx 和 .cfx-goo .cfx-ball 各有一条 0.18s)
 *   .cx-cell        展示页格子的入场(只有展示页有)
 *
 * 这里写的是全域的 `.cfx`,不是展示页里的 `.cx-stage .cfx`:活的那一层
 * (createLayer 挂上去的)在减弱动效下根本不会出现,但它没出现之前也没人保证
 * ——收过渡这件事不该依赖「它一定不出现」。格子里的同样的元素也被这条盖住。
 *
 * 真正在动的形状不是 CSS 的事:那是 cursor-fx.js 每帧画的 SVG,靠的是
 * hover.js / loading.js **整个不进状态**(见那两个文件里的 reduceMotion),
 * 不是这里少一条过渡。
 */
@media (prefers-reduced-motion: reduce) {
    .cfx {
        transition: none;
    }

    .cx-cell {
        animation: none;
    }
}
</style>
</head>
<body>
<!-- 亲肤：柔光底 + 圆形按下凹陷 -->
<canvas id="soft-light" aria-hidden="true"></canvas>
<div id="latex-noise" aria-hidden="true"></div>


<!--
  乳胶光照：把形状的 alpha 模糊成高度场，再用 feSpecularLighting / feDiffuseLighting
  按真实法线打光。这不是叠 box-shadow，是真的算了曲面法线，所以才有「吹起来」的体积。
  sm = 按钮/小元件，lg = 卡片/大面板（模糊半径要按尺寸放大）
-->
<svg id="latex-light-defs" aria-hidden="true" width="0" height="0" style="position:absolute">
  <defs>
    <filter id="latex-lit-sm" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="h" />
      <feDiffuseLighting in="h" surfaceScale="3.0" diffuseConstant="1.16" lighting-color="#fff8f3" result="d">
        <feDistantLight azimuth="235" elevation="55" />
      </feDiffuseLighting>
      <feSpecularLighting in="h" surfaceScale="10" specularConstant="2.0" specularExponent="44" lighting-color="#ffffff" result="s">
        <feDistantLight azimuth="235" elevation="54" />
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sc" />
      <feComposite in="d" in2="SourceGraphic" operator="arithmetic" k1="1" result="td0" />
      <feComposite in="td0" in2="SourceAlpha" operator="in" result="td" />
      <feBlend in="td" in2="sc" mode="screen" result="lit" />
    </filter>
    <filter id="latex-lit-lg" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="h" />
      <feDiffuseLighting in="h" surfaceScale="3.5" diffuseConstant="1.16" lighting-color="#fff8f3" result="d">
        <feDistantLight azimuth="235" elevation="55" />
      </feDiffuseLighting>
      <feSpecularLighting in="h" surfaceScale="13" specularConstant="2.1" specularExponent="38" lighting-color="#ffffff" result="s">
        <feDistantLight azimuth="235" elevation="54" />
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sc" />
      <feComposite in="d" in2="SourceGraphic" operator="arithmetic" k1="1" result="td0" />
      <feComposite in="td0" in2="SourceAlpha" operator="in" result="td" />
      <feBlend in="td" in2="sc" mode="screen" result="lit" />
    </filter>
    <filter id="latex-lit-sm-in" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="h0" />
      <feComponentTransfer in="h0" result="h"><feFuncA type="table" tableValues="1 0" /></feComponentTransfer>
      <feDiffuseLighting in="h" surfaceScale="3.0" diffuseConstant="1.08" lighting-color="#fff8f3" result="d">
        <feDistantLight azimuth="235" elevation="55" />
      </feDiffuseLighting>
      <feSpecularLighting in="h" surfaceScale="8" specularConstant="1.5" specularExponent="36" lighting-color="#ffffff" result="s">
        <feDistantLight azimuth="235" elevation="54" />
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sc" />
      <feComposite in="d" in2="SourceGraphic" operator="arithmetic" k1="1" result="td0" />
      <feComposite in="td0" in2="SourceAlpha" operator="in" result="td" />
      <feBlend in="td" in2="sc" mode="screen" result="lit" />
    </filter>
    <filter id="latex-lit-lg-in" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="h0" />
      <feComponentTransfer in="h0" result="h"><feFuncA type="table" tableValues="1 0" /></feComponentTransfer>
      <feDiffuseLighting in="h" surfaceScale="3.5" diffuseConstant="1.08" lighting-color="#fff8f3" result="d">
        <feDistantLight azimuth="235" elevation="55" />
      </feDiffuseLighting>
      <feSpecularLighting in="h" surfaceScale="10" specularConstant="1.6" specularExponent="32" lighting-color="#ffffff" result="s">
        <feDistantLight azimuth="235" elevation="54" />
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sc" />
      <feComposite in="d" in2="SourceGraphic" operator="arithmetic" k1="1" result="td0" />
      <feComposite in="td0" in2="SourceAlpha" operator="in" result="td" />
      <feBlend in="td" in2="sc" mode="screen" result="lit" />
    </filter>
  </defs>
</svg>
<div id="latex-ball" aria-hidden="true"></div>

<div id="color-palette" role="group" aria-label="乳胶颜色">
  <button type="button" class="color-swatch" data-theme="black" style="background:#1a1a1a" title="黑" aria-label="黑色"></button>
  <button type="button" class="color-swatch is-active" data-theme="white" style="background:#f1f1f4" title="白" aria-label="白色"></button>
  <button type="button" class="color-swatch" data-theme="blue" style="background:#6a9fd4" title="蓝" aria-label="蓝色"></button>
  <button type="button" class="color-swatch" data-theme="orange" style="background:#e8894a" title="橙" aria-label="橙色"></button>
</div>

<div id="navbar"></div>
<div id="content"></div>


<script data-from="skins/latex/latex.js">
/**
 * 乳胶外观 —— 只负责颜色主题。
 *
 * 曲面由 index.html 里的 SVG 光照滤镜（#latex-lit-*）生成，
 * 黑球光标由 ball.js 统一负责，这里都不碰。
 */
window.initLatexMembrane = function initLatexMembrane() {
    const root = document.documentElement;

    const THEMES = {
        white: true,
        black: true,
        blue: true,
        orange: true,
    };

    // 主题由 skin.js 统一调度：三个外观共用色板，切换外观时保留已选颜色
    window.__skinTheme = function (key) {
        const themeKey = THEMES[key] ? key : "white";
        root.dataset.theme = themeKey;
        root.classList.remove("theme-white", "theme-black", "theme-blue", "theme-orange");
        root.classList.add(`theme-${themeKey}`);
        document.querySelectorAll(".color-swatch").forEach((btn) => {
            btn.classList.toggle("is-active", btn.dataset.theme === themeKey);
        });
    };

    window.latexRefreshLayout = function () {};

    // ?theme=black|white|blue|orange 便于直接预览某套配色
    let initialTheme = window.__currentTheme || "white";
    try {
        const q = new URLSearchParams(location.search).get("theme");
        if (THEMES[q]) initialTheme = q;
    } catch (_) {}
    window.__skinTheme(initialTheme);

    return function destroy() {};
};
</script>

<script data-from="ball.js">
/**
 * 黑球光标：直接替换鼠标指针，三个外观共用。
 *
 * 位置不做弹簧跟随 —— pointermove 里直接写 transform，光标在哪球就在哪。
 * 只有「按下时的缩放」在 rAF 里做过渡，那是形变，不是跟随。
 *
 * 减弱动效（prefers-reduced-motion）下**只剩位置跟随**：缩放系数归零、rAF 整条不跑，
 * 于是这个文件变成纯事件驱动的 —— 没有一帧是为动画跑的。按下的反馈还在，
 * 但换成了「阴影收紧」那一下瞬时切换（各外观的 style.css 里本来就有），
 * 那不是动效，是换了个样子。同一个开关 hover.js / loading.js 也读，
 * 而且和这里一样只在初始化时读一次（见 cursor-states.md 那一行的已知界限）。
 *
 * 除了画球，这里还是**指针位置的唯一来源**：同时把状态发布到 window.cursorState，
 * 别的效果（加载态的液体光标）读它就行，不用再挂一份 pointermove 自己跟一遍。
 * 两个人各跟一遍，迟早会有一个慢半帧，看上去就是两层光标在打架。
 *
 * 还管着**什么时候把系统光标还回去**：脚本抛错就整台主题退场（handBack），
 * 因为这套东西顶替的是指针本身，坏掉的代价不是「样式难看」而是「没有鼠标」。
 */
window.initBallCursor = function initBallCursor() {
    const root = document.documentElement;
    const ball = document.getElementById("latex-ball");
    if (!ball) return function () {};

    // 和 hover.js / loading.js 里那份一模一样的读法，故意抄一遍：这三个文件谁都不依赖谁，
    // 读法要是不一样（比如这里读成 addEventListener 的实时值），减不动效就会半路分叉
    // ——液体不分裂了、球还在缩，比两边都做还难查。
    const reduceMotion = typeof matchMedia === "function"
        && matchMedia("(prefers-reduced-motion: reduce)").matches;

    let x = -9999;
    let y = -9999;
    let hasPointer = false;
    let press = 0;
    let targetPress = 0;
    let raf = 0;
    let last = performance.now();

    // 对外的共享状态。press 是滤波之后的值，targetPress 是目标的——加载态用前者的瞬时值。
    // pressScale 也放进来：接力的那一层（cursor-fx 的 createLayer）必须用**同一个系数**，
    // 否则按下时交回球的那一帧会跳一下。
    //
    // 0 是个有意义的值（减弱动效），读它的地方不能写成 `|| 0.14` —— 那样恰恰会把
    // 唯一一个该关掉的场景又打开。createLayer 那边就踩过这一脚。
    const shared = {
        x,
        y,
        press: 0,
        targetPress: 0,
        visible: false,
        pressScale: reduceMotion ? 0 : 0.14,
    };
    window.cursorState = shared;

    // 已经交还过系统光标了（见下面的 handBack）。也可能是**这个文件还没跑之前**
    // 就交还过 —— 别的模块先出错，根上已经挂上了 cursor-off，那就别再接手。
    let dead = root.classList.contains("cursor-off");
    let handBackReason = dead ? "before-init" : "";

    function place() {
        if (dead) return;
        const s = (1 - press * shared.pressScale).toFixed(3);
        ball.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${s})`;
    }

    function onMove(e) {
        if (dead) return;
        const t = e.touches ? e.touches[0] : e;
        if (!t) return;
        x = t.clientX;
        y = t.clientY;
        hasPointer = true;
        root.classList.add("has-pointer");
        ball.style.opacity = "1";
        shared.x = x;
        shared.y = y;
        shared.visible = true;
        place();
    }

    function onDown(e) {
        if (dead) return;
        targetPress = 1;
        shared.targetPress = 1;
        root.classList.add("is-pressing", "has-pointer");
        const t = e.touches ? e.touches[0] : e;
        if (t) {
            x = t.clientX;
            y = t.clientY;
            hasPointer = true;
            ball.style.opacity = "1";
            shared.x = x;
            shared.y = y;
            shared.visible = true;
            place();
        }
    }

    function onUp() {
        if (dead) return;
        targetPress = 0;
        shared.targetPress = 0;
        root.classList.remove("is-pressing");
    }

    function onLeave() {
        if (dead) return;
        hasPointer = false;
        targetPress = 0;
        root.classList.remove("has-pointer", "is-pressing");
        ball.style.opacity = "0";
        shared.visible = false;
        shared.targetPress = 0;
    }

    /*
     * 已经交还过了就别再挂监听 —— 那几个处理器进门第一句都是 `if (dead) return`，
     * 挂上也确实什么都不做，但那是四条常年空转的监听。更糟的是它会让人以为
     * 「这套东西还在跑」：排查的时候看到 pointermove 上挂着东西，就得读一遍才知道
     * 是死的。不接手的模块不该在事件上留下痕迹。
     */
    if (!dead) {
        document.addEventListener("pointermove", onMove, { passive: true, capture: true });
        document.addEventListener("pointerdown", onDown, { passive: true, capture: true });
        document.addEventListener("pointerup", onUp, { passive: true, capture: true });
        document.addEventListener("pointercancel", onUp, { passive: true, capture: true });
        document.documentElement.addEventListener("pointerleave", onLeave);
    }

    function tick(now) {
        if (dead) { raf = 0; return; }
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const next = press + (targetPress - press) * (1 - Math.exp(-14 * dt));
        if (Math.abs(next - press) > 0.0005) {
            press = next;
            shared.press = press;
            place();
        }
        raf = requestAnimationFrame(tick);
    }
    // 减弱动效下这条循环整个不跑：位置在 onMove 里就写完了，press 恒为 0，
    // 没有任何一帧是被需要的。留着空转的话，一个「不动画」的模式还在每帧醒一次。
    if (!reduceMotion && !dead) raf = requestAnimationFrame(tick);

    function destroyBall() {
        cancelAnimationFrame(raf);
        raf = 0;
        if (window.cursorState === shared) delete window.cursorState;
        document.removeEventListener("pointermove", onMove, true);
        document.removeEventListener("pointerdown", onDown, true);
        document.removeEventListener("pointerup", onUp, true);
        document.removeEventListener("pointercancel", onUp, true);
        document.documentElement.removeEventListener("pointerleave", onLeave);
    }

    /*
     * ===== 把系统光标还回去 =====
     *
     * 这套主题是**顶替**系统指针的：`html.has-pointer *` 把 cursor 全压成 none，
     * 位置全靠这颗球。所以它自己一旦坏掉，用户失去的不是「一个好看的样式」，
     * 是**指针本身** —— 看不见、也点不准。装饰可以少一个，指针不能少。
     *
     * 触发条件是「脚本抛错」。宽严的分寸在这里：
     *
     *   - 只认**脚本**自己的错。资源加载失败（图片 404、视频、iframe）也会以 error
     *     事件报到 window，可那是页面里天天发生的事，而且站上的图片本来就有
     *     「挂了就换一张」的兜底 —— 拿它把光标主题关掉，等于「网不好的时候鼠标就没样式了」。
     *     实测的判据：脚本错误是 ErrorEvent（有 message），资源错误没有；
     *     脚本错误的 target 是 window，资源错误的 target 是那个元素。两条都要过。
     *   - 认出来就**一次还到底，不回头**。出了错之后这套主题处在什么状态已经说不清了，
     *     让它半路自己回来只会变成更难看的样子（球回来了、位置是错的）。
     *     想看效果刷新一下页面就有了。
     *
     * 交还分两半，缺一不可：
     *
     *   JS 这一半（这里）—— 停掉三个模块的循环、摘掉类、藏起球、把监听全拆掉。
     *   CSS 那一半（skin-ui.css 末尾那条 `html.cursor-off`）—— **谁都没跑成**时的保险。
     *
     * 为什么光有 JS 这一半不够：它本身也在「这套代码」里。error 监听要等
     * initBallCursor() 被叫到才装上（skin.js 的 initSiteSkin 里那一行），而这中间
     * 任何一步抛错，装监听这件事自己就轮不到了；真到那一步，root 上可能已经挂着
     * has-pointer，却没有任何人负责摘掉它。CSS 那条不依赖任何一段 JS 跑对 ——
     * 只要根上有 cursor-off，藏光标那几条规则整片失效。
     *
     * 所以这一半要能被**外面**挂上：宿主自己知道该关的时候直接加 cursor-off 就行，
     * 不必先跟这套主题说上话（见 cursor-beyond-browser 那条）。
     */
    function handBack(reason) {
        if (dead) return false;
        dead = true;
        handBackReason = reason || "manual";
        // 先让另外两个模块自己停（各自会摘掉自己挂的类、拆掉自己的图层）
        try { if (window.LoadingWatch && window.LoadingWatch.handBack) window.LoadingWatch.handBack(); } catch (e) {}
        try { if (window.HoverWatch && window.HoverWatch.handBack) window.HoverWatch.handBack(); } catch (e) {}
        root.classList.remove("has-pointer", "is-pressing", "is-loading", "is-hover-state", "show-real-cursor");
        if (root.style && root.style.removeProperty) root.style.removeProperty("--real-cursor");
        // 这一条是给 CSS 看的：它一挂上，藏光标那几条规则就整片失效
        root.classList.add("cursor-off");
        shared.press = 0;
        shared.targetPress = 0;
        shared.visible = false;
