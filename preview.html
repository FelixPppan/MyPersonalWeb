<script data-from="skin.js">
/**
 * Appearance switcher: 亲肤 (soft / dent-press-7) ↔ 乳胶 (current slime latex)
 */
(function () {
    const SOFT = "soft";
    const LATEX = "latex";
    const GLASS = "glass";
    const KEY = "site-skin";
    const THEME_KEY = "site-theme";

    let destroyFn = null;
    let currentTheme = "white";

    function $(id) {
        return document.getElementById(id);
    }

    function setButtons(skin) {
        document.querySelectorAll("#skin-switcher [data-skin]").forEach((btn) => {
            btn.classList.toggle("is-active", btn.dataset.skin === skin);
        });
    }

    function setStylesheets(skin) {
        const soft = $("skin-css-soft");
        const latex = $("skin-css-latex");
        const glass = $("skin-css-glass");
        if (soft) soft.disabled = skin !== SOFT;
        if (latex) latex.disabled = skin !== LATEX;
        if (glass) glass.disabled = skin !== GLASS;
    }

    function teardown() {
        if (typeof destroyFn === "function") {
            try {
                destroyFn();
            } catch (e) {
                console.warn(e);
            }
        }
        destroyFn = null;
        document.documentElement.classList.remove("has-pointer", "is-pressing");
    }

    function boot(skin) {
        teardown();
        if (skin === SOFT) {
            if (typeof window.initSoftMembrane === "function") {
                destroyFn = window.initSoftMembrane() || null;
            }
        } else if (skin === GLASS) {
            if (typeof window.initGlassMembrane === "function") {
                destroyFn = window.initGlassMembrane() || null;
            }
        } else if (typeof window.initLatexMembrane === "function") {
            destroyFn = window.initLatexMembrane() || null;
        }
        if (typeof window.__skinTheme === "function") {
            window.__skinTheme(currentTheme);
        }
        if (typeof window.latexRefreshLayout === "function") {
            requestAnimationFrame(() => window.latexRefreshLayout());
        }
    }

    window.setSiteSkin = function setSiteSkin(skin) {
        const next = skin === SOFT ? SOFT : skin === GLASS ? GLASS : LATEX;
        document.documentElement.dataset.skin = next;
        try {
            localStorage.setItem(KEY, next);
        } catch (_) {}
        setStylesheets(next);
        setButtons(next);
        // Allow CSS to apply before measuring blisters / GL resize
        requestAnimationFrame(() => boot(next));
    };

    window.setSiteTheme = function setSiteTheme(key) {
        currentTheme = ["white", "black", "blue", "orange"].includes(key) ? key : "white";
        try {
            localStorage.setItem(THEME_KEY, currentTheme);
        } catch (_) {}
        if (typeof window.__skinTheme === "function") window.__skinTheme(currentTheme);
    };

    function initialSkin() {
        try {
            const q = new URLSearchParams(location.search).get("skin");
            if (q === SOFT || q === LATEX || q === GLASS) return q;
        } catch (_) {}
        try {
            const saved = localStorage.getItem(KEY);
            if (saved === SOFT || saved === LATEX || saved === GLASS) return saved;
        } catch (_) {}
        return LATEX; // default appearance: glossy latex
    }

    function initialTheme() {
        try {
            const q = new URLSearchParams(location.search).get("theme");
            if (["white", "black", "blue", "orange"].includes(q)) return q;
        } catch (_) {}
        try {
            const saved = localStorage.getItem(THEME_KEY);
            if (["white", "black", "blue", "orange"].includes(saved)) return saved;
        } catch (_) {}
        return "white";
    }

    function wire() {
        document.querySelectorAll("#skin-switcher [data-skin]").forEach((btn) => {
            btn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                window.setSiteSkin(btn.dataset.skin);
            });
        });
        // 色板只在这里绑一次，三个外观共用
        document.querySelectorAll(".color-swatch").forEach((btn) => {
            btn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                window.setSiteTheme(btn.dataset.theme);
            });
        });
    }

    window.initSiteSkin = function initSiteSkin() {
        currentTheme = initialTheme();
        // 皮肤的 JS 在初始化时读这个值应用配色
        window.__currentTheme = currentTheme;
        wire();
        // 黑球光标是三个外观共用的，只启动一次
        if (typeof window.initBallCursor === "function") {
            window.initBallCursor();
        }
        window.setSiteSkin(initialSkin());
    };
})();
</script>
<script data-from="main.js">
// 纯路由，无任何数据
const navItems = [
    { name: "首页 | Home", page: "home" },
    { name: "博客 | Blog", page: "blog" },
    { name: "作品集 | Portfolio", page: "portfolio" },
    { name: "光标 | Cursor", page: "cursor" },
    { name: "关于我 | About", page: "about" },
];

/*
 * 导航是一条 `<a href="#/页面">`，不是光挂个 onclick 的 `<a>`。
 *
 * 差别不是好看：没有 href 的 `<a>` **不在 Tab 顺序里**，键盘根本够不着它 ——
 * 而这是全站唯一的导航。走到别的页面只靠改地址栏，那不叫导航。
 * href 让它天然可聚焦、Enter 天然能按，不用补 tabindex、不用补键盘事件。
 *
 * onclick 留着不是为了激活，是为了**快一帧**：它同步 renderPage()，而 href 走
 * hashchange 是异步的。两个一起上不冲突 —— href 要写的哈希值和 go() 写的是同一个，
 * 值没变就不会再触发一次 hashchange。
 *
 * 补这段的时候顺手记一笔：`<a href>` 会让链接落进 skin-ui.css 里 `a[href]` 那一组
 * （可点击、以及「里面的文字不算文本」那条排除链）。导航项本来就在
 * `.nav-btn a` 那一组里，所以意图没变；但下划线得确认过 —— 三个外观的
 * `.nav-btn a` 都写了 `text-decoration: none`（href 会带出 UA 的下划线）。
 */
function renderNav() {
    document.getElementById("navbar").innerHTML = `
    <ul>
      ${navItems.map(n => `
        <li class="nav-btn latex-blister" data-blister="round"><a href="#/${n.page}" onclick="go('${n.page}')">${n.name}</a></li>
      `).join('')}
    </ul>
  `;
}

window.go = function (page) {
    location.hash = `/${page}`;
    renderPage();
};

window.renderPage = function () {
    const fullHash = location.hash.replace('#', '');
    const path = fullHash.split('?')[0];
    const page = path.replace('/', '') || "home";

    if (page === "home") renderHome();
    else if (page === "blog") renderBlog();
    else if (page === "portfolio") renderPortfolio();
    else if (page === "cursor") renderCursor();
    else if (page === "about") renderAbout();
    else if (page.includes("project")) renderProject();

    requestAnimationFrame(() => {
        document.querySelectorAll(".card, .portfolio-item, .btn, .blog-tab-btn").forEach((el) => {
            el.classList.add("latex-blister");
            if (!el.dataset.blister) {
                el.dataset.blister = "round";
            }
        });
        applyRevealOrder();
        if (typeof window.latexRefreshLayout === "function") window.latexRefreshLayout();
        // 页面刚拼出来，里面的图/视频/iframe 从现在起才开始加载 —— 该重新数一遍了
        if (window.LoadingWatch) window.LoadingWatch.scan();
        // 同理：新页面可能把一块可点的元素正好推到静止的指针底下，
        // 那种情况一个 pointerover 都不会来，得主动问一次
        if (window.HoverWatch) window.HoverWatch.refresh();
    });
};

/*
 * 出现顺序：按「从上到下、从左到右」排队，依次给每个元素写 animation-delay，
 * 让整页是顺着阅读方向长出来的，而不是一起冒出来。
 */
function applyRevealOrder() {
    const nodes = Array.from(
        document.querySelectorAll(".nav-btn, .card, .portfolio-item, .blog-tab-btn, .cx-cell")
    );
    if (!nodes.length) return;

    const items = nodes.map((el) => {
        const r = el.getBoundingClientRect();
        return { el, top: r.top + window.scrollY, left: r.left };
    });

    // 同一排（纵向差小于半行）算一行，行内再从左到右
    const ROW = 28;
    items.sort((a, b) => {
        const rowA = Math.round(a.top / ROW);
        const rowB = Math.round(b.top / ROW);
        if (rowA !== rowB) return rowA - rowB;
        return a.left - b.left;
    });

    items.forEach((item, i) => {
        item.el.style.animationDelay = `${Math.min(i * 55, 880)}ms`;
    });
}

renderNav();
window.onload = () => {
    renderPage();
    window.addEventListener("hashchange", renderPage);
    if (typeof window.initSiteSkin === "function") initSiteSkin();
    else if (typeof window.initLatexMembrane === "function") initLatexMembrane();
};
</script>

            <div class="blog-section">
                <h3>The Initial Stage</h3>
                <p>In the first few weeks, we brainstormed ideas for our game. Initially, the team adopted my concept: players take on dual roles as both the town mayor and dungeon master. The ultimate goal is to turn Rockfall Town into a haven for adventurers and the dungeon into a world-famous challenge site, achieving prosperity for the town and steady profits from the dungeon at the same time.</p>

                <p>This is essentially what our current demo looks like. To be honest, it is more of a showcase of basic functions and core concepts rather than a fully polished demo. We received plenty of constructive feedback during in-class presentations.</p>

                <p>I am a member of our team. This post traces how our topic moved from hair-card technology to distance × model fidelity,

The effect of distance-based LOD switching on perception of virtual characters.

\nRQs: (RQ1) Does LOD vs high-fidelity change character perception? (RQ2) Does viewing distance moderate that effect?</p>
            </div>
                        <div class="blog-section">

            </div>
                        <div class="blog-section">

<script data-from="pages/cursor.js">
/**
 * 光标状态展示页。
 *
 * 每一格跑一份独立的 CursorFX 实例，按脚本演出「开始 → 结束」，停一下再从头播。
 * 之所以不循环播中间那段：分裂的起始（颈缩怎么长出来）和合并的收尾（三个球怎么并回去）
 * 才是要给人看的东西，一直循环最热闹的环转反而把两头都藏掉了。
 *
 * 这一页和 cursor-states.md 是一对：那里是清单，这里是能点开看的证据。
 * 谁的状态变了，两处一起改。
 */

const easeOutCubic = (u) => 1 - Math.pow(1 - u, 3);

/*
 * 元素状态的「在场程度」q —— 和 hover.js 里跑的是同一条曲线:一阶滤波追一个目标,
 * 进入和退出各一个时间常数(从引擎 CFG 读,不在这边另写一份)。
 *
 * 这里解成闭式,是因为展示页的时间轴必须能「按当前时间直接画」:离屏的格子不跑,
 * 回到视口时得立刻给出那一刻该有的帧。真站点上 q 是逐帧累积的,两者在数值上
 * 是同一条指数曲线。
 *
 * 退出段只走到 4 个时间常数就结束(q≈0.018)—— 和 hover.js 交回 #latex-ball 的
 * 时机一模一样(EPS=0.015 就在那附近)。所以循环末尾那一帧本来就已经是一颗
 * R0 的球了,收尾把它藏掉看不出任何区别,不用额外做淡出。
 */
const STATE_RISE_MS = 420;      // 化开:4 个多时间常数,q≈0.99
const STATE_FALL_MS = 546;      // 收回去:4 个多时间常数,走到交接的那个 q

/*
 * 一条 q 曲线,给两个时间常数(进入 / 退出)就是一条。起落各走 4.7 / 4.2 个时间常数
 * ——就是 hover.js 里「收完就交回 #latex-ball」的那个时机,和上面两个常数的对法一致。
 */
function qOf(t, holdMs, tauIn, tauOut) {
    const rise = 4.7 * tauIn;
    if (t <= rise) return 1 - Math.exp(-t / tauIn);
    const qTop = 1 - Math.exp(-rise / tauIn);
    if (t <= rise + holdMs) return qTop;
    return qTop * Math.exp(-(t - rise - holdMs) / tauOut);
}

function stateQ(t, holdMs) {
    const c = window.CursorFX.CFG;
    return qOf(t, holdMs, c.STATE_IN_TAU, c.STATE_OUT_TAU);
}

/*
 * 按下这一格按住多久再松手。按下不是一次形变(那才是上面那 420ms 的事),是一下:
 * 摊开只花 4.7×45≈210ms,所以这里停得久一点,让「按住一直摊着」这半句看得见。
 */
const PRESS_HOLD_MS = 900;

/*
 * 元素状态格子全用同一个 frame:差别只在引擎的那个采样函数。
 * 液体的时间就用格子自己的 t —— 蠕动/呼吸的相位需要连续,不能用 q 反推。
 */
function elementCell(id, zh, en, pick, hold, note) {
    const stillAt = STATE_RISE_MS + 300;
    return {
        id,
        zh,
        en,
        chip: "元素触发",
        act: STATE_RISE_MS + hold + STATE_FALL_MS,
        note,
        frame(t, fx) {
            fx.setVisible(true);
            fx.setLiquid(pick(t, stateQ(t, hold)));
        },
        still(fx) {
            const q = stateQ(stillAt, hold);
            fx.setVisible(true);
            fx.setLiquid(pick(stillAt, q));
        },
    };
}

/*
 * 每格一个 def：
 *   act   这一演出多长（数字，或函数——加载中那格要读引擎的 TOTAL_MS）
 *   frame 给定「本演出已过去 t 毫秒」，把这一格画成什么
 *   still 减弱动效时只画这一帧，不循环
 *   chip  角标文字，默认「已实现」
 */
const CELLS = [
    {
        id: "default",
        zh: "默认",
        en: "default",
        act: 1500,
        note: "普通内容、空白处。26px 实心球，无形变。没有开始和结束可言，这里只是静置一拍。",
        frame(t, fx) {
            fx.setVisible(true);
            fx.setBall(0, 0, 1);
        },
        still(fx) {
            fx.setVisible(true);
            fx.setBall(0, 0, 1);
        },
    },
    {
        id: "move",
        zh: "常规移动",
        en: "move",
        act: 2800,
        note: "位置直接写在 pointermove 里，逐帧只做按压插值。刻意没做弹簧跟随——延迟会让「指哪打哪」变成「追着跑」。",
        frame(t, fx, act) {
            const a = (t / act) * Math.PI * 2;
            fx.setVisible(true);
            // 8 字：起止同点同速，接缝看不出来
            fx.setBall(58 * Math.sin(a), 46 * Math.sin(2 * a), 1);
        },
        still(fx) {
            fx.setVisible(true);
            fx.setBall(58, 0, 1);
        },
    },
    /*
     * ── 点击特效 ──
     *
     * 以前这一格是「球缩到 0.86」:那是**缩放**,不是形状,也没有一点「按下去」的意思
     * ——看着像球被按瘪了一点,看不出这一下落在了什么地方。用户要的是「液体摊开」,
     * 时序照旧(「按住一直摊着,松手聚拢」)。
     *
     * ---- 形状做过三版,前两版都被用户否了 ----
     *
     * 第一版按的是**侧视**:一摊扁的(宽/高 ≈ 2)液体,中间连着,整摊比指针低 6px。
     * 用户的原话是**「现在是扁扁的形状,这不对,应该是圆形的,因为是俯视角度,液体摊开
     * 的效果」** —— 俯视看下去,「扁」和「低」在画面上根本不存在,那两条只是侧视的错觉。
     * 用户另外还定了:边是「圆 + 外围溅出的小液滴」,「掉下去」那一项直接去掉。

function mountCursorGallery() {
    if (!window.CursorFX) return;

    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const items = Array.from(document.querySelectorAll(".cx-stage[data-cx]"))
        .map((stage, i) => {
            const def = CELLS.find((c) => c.id === stage.dataset.cx);
            if (!def) return null;
            const fx = window.CursorFX.create(stage);
            fx.setVisible(false);
            return { def, fx, stage, offset: i * 420, onScreen: true, wasRunning: false };
        })
        .filter(Boolean);

    if (!items.length) return;

    // 减弱动效：不循环，每格停在最有代表性的一帧
    if (reduce) {
        for (const it of items) {
            it.def.still(it.fx);
        }
        return;
    }

    // 离屏的格子不跑。时间轴是纯函数，回到视口直接按当前时间画，不会有接不上的问题。
    if (typeof IntersectionObserver === "function") {
        const io = new IntersectionObserver((entries) => {
            for (const e of entries) {
                const it = items.find((x) => x.stage === e.target);
                if (it) it.onScreen = e.isIntersecting;
            }
        }, { rootMargin: "120px" });
        for (const it of items) io.observe(it.stage);
    }

    const start = performance.now();
    let raf = 0;

    function tick(now) {
        let alive = false;

        for (const it of items) {
            // 换页时 #content 被整体替换，旧实例自然失联 —— 据此自停，不用外部记得来注销
            if (!it.stage.isConnected) continue;
            alive = true;
            if (!it.onScreen) continue;

            const act = typeof it.def.act === "function" ? it.def.act() : it.def.act;
            const cycle = act + PAUSE_MS;
            const local = (((now - start - it.offset) % cycle) + cycle) % cycle;
            const running = local < act;

            if (running) {
                it.def.frame(local, it.fx, act);
            } else if (it.wasRunning) {
                it.fx.setVisible(false);
            }
            it.wasRunning = running;
        }

        if (!alive) {
            raf = 0;
            return;
        }
        raf = requestAnimationFrame(tick);
    }

    raf = requestAnimationFrame(tick);
}

/*
 * 试玩区那个小窗口是真的能缩放的 —— 不是「演示缩放」,是这块面板真的在改尺寸。
 *
 * 为什么值得写这一段:光有一块声明了 --cursor: ew-resize 的元素,能说明的只有
 * 「指针放上去形状对」。这一条真正特别的地方是**按住之后形状盖过一切**,而不按住
 * 就看不到:拖到一半指针会划过按钮、划过正文、划出窗口,形状都不该跟着变。
 * 缩放窗口本来是最自然的例子,可浏览器里缩放不了真窗口,那就给一块真能被缩放的
 * 东西 —— 拖起来的过程中指针底下是什么完全不确定,和真缩放窗口时是一回事。
 *
 * 监听挂在 document 上而不是那块元素上,也不用 pointer capture:capture 会把
 * 后续的 pointer 事件**全部改派到捕获元素**上,hover.js 的 pointerup 是拿事件
 * 自带的 target 去认「松手时指针在哪」的,一旦改派就永远认成这块把手,松手后
 * 形状会错到下一次移动为止。挂在 document 上就没有这个问题,代价只是指针出文档
 * 时要自己收手(见下面的 blur)。
 *
 * 四个把手方向不同但共用一套算法:dx/dy 是「指针相对按下时挪了多远」,
 * 东/南边按正方向加,nw 反过来减 —— 而且 nw 得同时用 transform 把自己往回挪,
 * 否则左上角会跟着跑,右下角反而动了(拖动缩放时对面那个角是不动的)。
 *
 * 换页时按站上既有的约定自停:#content 被整体替换,这块元素自然失联,监听自己走。
 */
function mountWindowResize() {
    const win = document.querySelector(".cx-win-resize");
    if (!win || typeof win.addEventListener !== "function") return;
    if (typeof win.querySelectorAll !== "function") return;
    const grips = Array.from(win.querySelectorAll("[data-resize]") || []);
    if (!grips.length) return;

    // 尺寸的上下界:小到看不出是块面板、大到盖住旁边的说明,都不好
    const MIN = { w: 150, h: 96 };
    const MAX = { w: 460, h: 300 };
    let id = null;      // 正在拖的那根手指/那支笔;null = 没在拖
    let dir = "";       // 拖的是哪条边/角(e / s / se / nw),就是 data-resize 的值
    let px0 = 0, py0 = 0;   // 按下时指针在哪
    let w0 = 0, h0 = 0;     // 按下时窗口多大

    function apply(dx, dy) {
        let w = w0, h = h0;
        if (dir === "e" || dir === "se") w = w0 + dx;
        if (dir === "s" || dir === "se") h = h0 + dy;
        if (dir === "nw") { w = w0 - dx; h = h0 - dy; }
        w = Math.max(MIN.w, Math.min(MAX.w, w));
        h = Math.max(MIN.h, Math.min(MAX.h, h));
        win.style.width = w + "px";
        win.style.height = h + "px";
        // nw:左边也动了,所以把整块往右挪「少掉的那部分」,让右下角待在原地
        const tx = dir === "nw" ? w0 - w : 0;
        const ty = dir === "nw" ? h0 - h : 0;
        win.style.transform = tx || ty ? `translate(${tx}px, ${ty}px)` : "";
    }

    function down(e) {
        if (id !== null || e.button !== 0) return;
        if (typeof e.currentTarget.dataset !== "object") return;
        dir = e.currentTarget.dataset.resize || "";
        if (!dir) return;
        const r = typeof win.getBoundingClientRect === "function"
            ? win.getBoundingClientRect()
            : { width: 0, height: 0 };
        id = e.pointerId;
        px0 = e.clientX;
        py0 = e.clientY;
        w0 = r.width;
        h0 = r.height;
        win.classList.add("is-resizing");
        // 别顺手把窗口里的字选中了 —— 这一段要演的是「缩放」,不是「选」
        e.preventDefault();
    }

    function move(e) {
        if (!live() || e.pointerId !== id) return;
        apply(e.clientX - px0, e.clientY - py0);
    }

    function up(e) {
        if (!live() || e.pointerId !== id) return;
        endResize();
    }

    // 松手:只收工,不还原 —— 窗口多大就是多大,免得看不出自己拖出来的结果
    function endResize() {
        id = null;
        dir = "";
        win.classList.remove("is-resizing");
    }

    // 元素不在文档里了(换页了)就把自己摘干净,和上面那个循环是同一条约定
    function live() {
        if (win.isConnected) return true;
        for (const g of grips) g.removeEventListener("pointerdown", down);
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        document.removeEventListener("pointercancel", up);
        window.removeEventListener("blur", endResize);
        return false;
    }

    for (const g of grips) g.addEventListener("pointerdown", down);
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
    // 指针到浏览器窗口外面松手,pointerup 不一定送得到 —— 失焦时权当松手了。
    // 只收工、不还原:切一下标签页就把窗口弹回原尺寸,那是另一回事
    window.addEventListener("blur", endResize);
}
</script>
